name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Um push novo cancela a execução anterior do mesmo branch em vez de acumular filas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Os testes levam menos de 2 minutos; o limite evita um job preso consumindo minutos.
    timeout-minutes: 15
    steps:
      # Actions fixadas pelo commit (a tag v4 é móvel). O Dependabot atualiza estes hashes.
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tornar o Maven Wrapper executável
        run: chmod +x api/mvnw

      - name: Instalar Chromium e dependências do Playwright
        working-directory: api
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: ./mvnw --batch-mode --no-transfer-progress exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Executar testes com PostgreSQL via Testcontainers
        working-directory: api
        run: ./mvnw --batch-mode --no-transfer-progress test

      # Sobe só o PostgreSQL do compose em um projeto descartável; não depende do JAR nem de imagem própria.
      - name: Provar cópia e restauração (ida e volta)
        run: bash deploy/backup-teste.sh

      # Guarda os relatórios quando algo falha, para ler o motivo sem reproduzir localmente.
      - name: Guardar relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports
          path: api/target/surefire-reports
          retention-days: 7
