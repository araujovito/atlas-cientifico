name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tornar o Maven Wrapper executável
        run: chmod +x api/mvnw

      - name: Executar testes com PostgreSQL via Testcontainers
        working-directory: api
        run: ./mvnw --batch-mode --no-transfer-progress test
