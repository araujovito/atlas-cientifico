name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Um push novo cancela a execução anterior do mesmo branch em vez de acumular filas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Os testes levam menos de 2 minutos; o limite evita um job preso consumindo minutos.
    timeout-minutes: 15
    steps:
      # Actions fixadas pelo commit (a tag v4 é móvel). O Dependabot atualiza estes hashes.
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tornar o Maven Wrapper executável
        run: chmod +x api/mvnw

      - name: Instalar Chromium e dependências do Playwright
        working-directory: api
        env:
          PLAYWRIGHT_SKIP_BROWSER_GC: '1'
        run: ./mvnw --batch-mode --no-transfer-progress exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Executar testes com PostgreSQL via Testcontainers
        working-directory: api
        run: ./mvnw --batch-mode --no-transfer-progress test

      # Sobe só o PostgreSQL do compose em um projeto descartável; não depende do JAR nem de imagem própria.
      - name: Provar cópia e restauração (ida e volta)
        run: bash deploy/backup-teste.sh

      - name: Validar o overlay do proxy TLS
        run: bash deploy/proxy-teste.sh

      # Guarda os relatórios quando algo falha, para ler o motivo sem reproduzir localmente.
      - name: Guardar relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports
          path: api/target/surefire-reports
          retention-days: 7

  # Sobe o compose de verdade (API, worker e PostgreSQL) em um projeto descartável. Em repositório público o
  # tempo de Actions é gratuito; é aqui que o healthcheck do worker, o JAR empacotado e as contas são exercitados.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Empacotar o JAR
        working-directory: api
        run: chmod +x mvnw && ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Smoke do compose (API, worker e PostgreSQL)
        run: node deploy/smoke.mjs

  # Repete a classe de testes de navegador em outros motores. O cookie de sessão é __Host-/Secure, e é justamente
  # no Safari (WebKit) que ele costuma se comportar diferente; este job existe para isso ficar à vista.
  navegadores:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # WebKit ainda não passa (a primeira execução estourou o prazo); não bloqueia enquanto a causa não é investigada.
    continue-on-error: ${{ matrix.motor == 'webkit' }}
    strategy:
      fail-fast: false
      matrix:
        motor: [firefox, webkit]
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Instalar o navegador e as dependências
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps ${{ matrix.motor }}"

      - name: Diagnóstico do navegador (${{ matrix.motor }})
        working-directory: api
        continue-on-error: true
        timeout-minutes: 5
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=DiagnosticoNavegadorTest -Datlas.diagnostico=true -Datlas.navegador=${{ matrix.motor }} | grep -E "DIAGNOSTICO|Tests run:|ERROR" || true

      - name: Testes de navegador em ${{ matrix.motor }}
        working-directory: api
        run: ./mvnw --batch-mode --no-transfer-progress test -Dtest=InterfaceNavegadorTest -Datlas.navegador=${{ matrix.motor }}
