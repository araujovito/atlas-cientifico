# Proxy TLS por cima do compose.yml:
#   ATLAS_DOMINIO=atlas.exemplo.org docker compose -f deploy/compose.yml -f deploy/compose.proxy.yml up -d
# A API continua publicada só em 127.0.0.1; quem chega de fora passa pelo proxy.
services:
  proxy:
    image: caddy:2@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ATLAS_DOMINIO: ${ATLAS_DOMINIO:?Defina ATLAS_DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  api:
    environment:
      # Origin do navegador é https://dominio; o Tomcat vê http. Sem isto todo POST, inclusive o login, dá 403.
      ATLAS_ORIGENS_PERMITIDAS: https://${ATLAS_DOMINIO:?Defina ATLAS_DOMINIO}
      # Seguro porque a porta da API só aceita conexões locais; veja docs/contas-e-hospedagem.md.
      ATLAS_LIMITES_CABECALHO_IP: X-Forwarded-For
volumes:
  caddy_data:
  caddy_config:
