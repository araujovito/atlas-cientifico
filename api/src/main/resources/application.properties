spring.application.name=atlas
atlas.documentos.diretorio=${ATLAS_DOCUMENTOS_DIR:./data/documentos}
atlas.documentos.tamanho-maximo-bytes=${ATLAS_DOCUMENTOS_TAMANHO_MAXIMO:20971520}
spring.servlet.multipart.max-file-size=${ATLAS_DOCUMENTOS_TAMANHO_MAXIMO:20971520}B
spring.servlet.multipart.max-request-size=${ATLAS_DOCUMENTOS_TAMANHO_MAXIMO:20971520}B

# As mensagens das ResponseStatusException são textos fixos escritos no código (sem dados do
# banco nem stack trace); sem isto o cliente recebe só o status e a tela não explica o erro.
server.error.include-message=always
server.error.include-stacktrace=never

# Padrões de desenvolvimento, alinhados ao docker-compose.yml. Em qualquer outro ambiente
# defina as três variáveis; a senha padrão existe só para a máquina local.
spring.datasource.url=${ATLAS_DB_URL:jdbc:postgresql://localhost:5433/atlas}
spring.datasource.username=${ATLAS_DB_USER:atlas}
spring.datasource.password=${ATLAS_DB_PASSWORD:atlas-dev}

# Só /actuator/health fica exposto, e de forma explícita: se outro endpoint do Actuator
# for ligado por engano, ele não herda a ausência de autenticação da API.
management.endpoints.web.exposure.include=health
