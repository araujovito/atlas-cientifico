spring.application.name=atlas
atlas.documentos.diretorio=${ATLAS_DOCUMENTOS_DIR:./data/documentos}
atlas.documentos.tamanho-maximo-bytes=${ATLAS_DOCUMENTOS_TAMANHO_MAXIMO:20971520}
spring.servlet.multipart.max-file-size=${ATLAS_DOCUMENTOS_TAMANHO_MAXIMO:20971520}B
# Folga de 1 MiB para os campos de texto do formulário, para que um PDF no limite não receba 413.
spring.servlet.multipart.max-request-size=${ATLAS_DOCUMENTOS_REQUISICAO_MAXIMA:22020096}B

# Erros no formato RFC 9457 (application/problem+json). A tela lê o campo "detail", e sem isto
# o Spring só devolve o status: as razões escritas nas ResponseStatusException (recusa de OCR,
# trecho ambíguo, valor ausente) nunca chegavam ao cliente. São textos fixos do código,
# sem dados do banco; stack trace continua desligado.
spring.mvc.problemdetails.enabled=true
server.error.include-message=always
server.error.include-stacktrace=never

# Padrões de desenvolvimento, alinhados ao docker-compose.yml. Em qualquer outro ambiente
# defina as três variáveis; a senha padrão existe só para a máquina local.
spring.datasource.url=${ATLAS_DB_URL:jdbc:postgresql://localhost:5433/atlas}
spring.datasource.username=${ATLAS_DB_USER:atlas}
spring.datasource.password=${ATLAS_DB_PASSWORD:atlas-dev}

# Só /actuator/health fica exposto, e de forma explícita: se outro endpoint do Actuator
# for ligado por engano, ele não herda a ausência de autenticação da API.
management.endpoints.web.exposure.include=health

# Chave compartilhada exigida em /api/** (cabeçalho X-Atlas-Chave). Vazia = sem proteção, só para
# desenvolvimento local. Defina ATLAS_CHAVE_API em qualquer ambiente acessível pela rede.
atlas.seguranca.chave-api=${ATLAS_CHAVE_API:}

# Decisão do autor: cadastro aberto. Pode ser FECHADO ou LISTA sem mudar o código.
atlas.contas.cadastro=${ATLAS_CADASTRO:ABERTO}
atlas.contas.emails-permitidos=${ATLAS_EMAILS_PERMITIDOS:}
# Sem endpoint de download/compartilhamento na Fase A. Compartilhamento ficou para depois.
atlas.contas.pdf-original=${ATLAS_PDF_ORIGINAL:DESABILITADO}

# Consulta de metadados. Sem chave usa o acesso anônimo do OpenAlex.
atlas.fontes.openalex.chave-api=${OPENALEX_API_KEY:}

# Telemetria externa é opt-in. Não enviar logs, métricas ou traços por padrão.
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
management.tracing.export.otlp.enabled=false
